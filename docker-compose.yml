services:
  base_datos:
    image: postgres:16-alpine
    container_name: alquiler-bicicletas-base-datos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alquiler_bicicletas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - datos_postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alquiler-bicicletas-api
    restart: unless-stopped
    depends_on:
      base_datos:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://base_datos:5432/${POSTGRES_DB:-alquiler_bicicletas}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  datos_postgresql:
    name: alquiler-bicicletas-postgresql