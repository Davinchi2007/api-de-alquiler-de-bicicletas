$kind: http-request
description: Consulta bicicletas en estado DISPONIBLE. Espera 200 OK.
url: "{{baseUrl}}/api/bicicletas/disponibles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Respuesta es lista', () => pm.expect(pm.response.json()).to.be.an('array')); 
    language: text/javascript
order: 6000
