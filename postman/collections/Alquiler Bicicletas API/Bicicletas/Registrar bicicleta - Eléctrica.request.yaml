$kind: http-request
description: Registra una bicicleta eléctrica. Espera 201 Created.
url: "{{baseUrl}}/api/bicicletas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "{{codigoBicicletaElectrica}}",
      "tipo": "ELÉCTRICA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Tipo correcto', () => pm.expect(pm.response.json().tipo).to.eql('ELÉCTRICA')); 
    language: text/javascript
order: 3000
