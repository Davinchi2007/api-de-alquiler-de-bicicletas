$kind: http-request
description: Consulta una bicicleta registrada. Espera 200 OK.
url: "{{baseUrl}}/api/bicicletas/{{codigoBicicletaUrbana}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Estado disponible', () => pm.expect(pm.response.json().estado).to.eql('DISPONIBLE')); 
    language: text/javascript
order: 4000
