$kind: http-request
description: Filtra disponibilidad por ELÉCTRICA. Espera 200 OK.
url: "{{baseUrl}}/api/bicicletas/disponibles?tipo=ELÉCTRICA"
method: GET
queryParams:
  tipo: ELÉCTRICA
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Todas son electricas', () => pm.response.json().forEach(b => pm.expect(b.tipo).to.eql('ELÉCTRICA'))); 
    language: text/javascript
order: 9000
