$kind: http-request
description: Consulta un codigo inexistente. Espera 404 Not Found.
url: "{{baseUrl}}/api/bicicletas/BIC-999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Formato de error', () => pm.expect(pm.response.json()).to.have.property('message')); 
    language: text/javascript
order: 5000
