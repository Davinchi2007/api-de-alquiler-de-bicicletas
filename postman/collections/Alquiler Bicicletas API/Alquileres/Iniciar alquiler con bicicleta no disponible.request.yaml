$kind: http-request
description: Intenta alquilar una bicicleta ALQUILADA. Espera 409 Conflict.
url: "{{baseUrl}}/api/alquileres"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigoBicicleta": "{{codigoBicicletaMontana}}",
      "nombreCliente": "Otro Cliente",
      "fechaHoraInicio": "{{fechaHoraInicio}}",
      "duracionEstimadaHoras": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Respuesta JSON', () => pm.response.to.be.json); 
    language: text/javascript
order: 3000
