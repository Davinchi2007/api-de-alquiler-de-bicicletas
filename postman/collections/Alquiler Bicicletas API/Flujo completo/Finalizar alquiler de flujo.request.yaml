$kind: http-request
description: "Paso 7: finaliza con retraso y verifica importes devueltos."
url: "{{baseUrl}}/api/alquileres/BIC-FLUJO-001/finalizar"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fechaHoraDevolucion": "2026-09-12T11:20:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Horas facturables correctas', () => pm.expect(pm.response.json().horasFacturables).to.eql(3));
      pm.test('Costo base correcto', () => pm.expect(pm.response.json().costoBase).to.eql(15000));
      pm.test('Multa correcta', () => pm.expect(pm.response.json().multa).to.eql(2500));
      pm.test('Total correcto', () => pm.expect(pm.response.json().total).to.eql(17500));
    language: text/javascript
order: 6000
