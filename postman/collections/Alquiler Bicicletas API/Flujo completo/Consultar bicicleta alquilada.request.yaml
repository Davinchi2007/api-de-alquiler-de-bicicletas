$kind: http-request
description: "Paso 4 y 5: verifica que la bicicleta queda ALQUILADA."
url: "{{baseUrl}}/api/bicicletas/BIC-FLUJO-001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Estado alquilada', () => pm.expect(pm.response.json().estado).to.eql('ALQUILADA')); 
    language: text/javascript
order: 4000
