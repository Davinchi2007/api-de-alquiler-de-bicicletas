$kind: http-request
description: "Paso 6: intenta alquilar la bicicleta ALQUILADA. Espera 409 Conflict."
url: "{{baseUrl}}/api/alquileres"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigoBicicleta": "BIC-FLUJO-001",
      "nombreCliente": "Segundo Cliente",
      "fechaHoraInicio": "2026-09-12T10:00:00",
      "duracionEstimadaHoras": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 5000
